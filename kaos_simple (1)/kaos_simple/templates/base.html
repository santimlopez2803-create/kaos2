<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}KAOS{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

  <!-- Mensajes que mandamos desde Python con flash() -->
  {% for texto in get_flashed_messages() %}
    <div class="mensaje">{{ texto }}</div>
  {% endfor %}

  <header class="barra">
    <div class="contenedor">
      <a href="{{ url_for('inicio') }}"><img src="{{ url_for('static', filename='img/logo-kaos.png') }}" alt="KAOS"></a>
      <nav>
        <a href="{{ url_for('inicio') }}#tienda">Tienda</a>
        <a href="{{ url_for('inicio') }}#personaliza">Personaliza</a>
        <a href="{{ url_for('inicio', categoria='Ofertas') }}#tienda">Ofertas</a>
        <a href="{{ url_for('seguimiento') }}">Seguir pedido</a>
      </nav>
      <div class="derecha">
        {% if usuario %}
          <a href="{{ url_for('panel') }}">Hola, {{ usuario.nombre.split()[0] }}</a>
          <a href="{{ url_for('salir') }}">Salir</a>
        {% else %}
          <a href="{{ url_for('login') }}">Ingresar</a>
        {% endif %}
        <a class="bolsa" href="{{ url_for('ver_carrito') }}">🛒 {{ carrito.cantidad() }}</a>
      </div>
    </div>
  </header>

  {% block contenido %}{% endblock %}

  <footer>
    <div class="contenedor">KAOS 2026 - COLOMBIA</div>
  </footer>

  <script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
